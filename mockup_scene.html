<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Openbill Safaris Uganda — Responsive Device Presentation Mockup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 2048px;
    height: 2048px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 46%, #FFFFFF 0%, #F5F5F8 32%, #E8E8EC 68%, #D4D4DA 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .stage {
    position: relative;
    width: 2048px;
    height: 2048px;
  }

  /* ---------------------------------------------------- */
  /* LAPTOP (MacBook Pro)                                 */
  /* ---------------------------------------------------- */
  .laptop-shadow {
    position: absolute;
    top: 1435px;
    left: 174px;
    width: 1700px;
    height: 70px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.34) 0%, rgba(0, 0, 0, 0.12) 50%, transparent 75%);
    filter: blur(18px);
    z-index: 1;
  }

  .laptop-wrap {
    position: absolute;
    top: 415px;
    left: 244px;
    width: 1560px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    filter: drop-shadow(0 42px 95px rgba(0, 0, 0, 0.28)) drop-shadow(0 15px 35px rgba(0, 0, 0, 0.16));
  }

  .laptop-lid {
    position: relative;
    width: 1560px;
    height: 996px;
    background: #0C0C0D;
    border-radius: 30px 30px 0 0;
    padding: 28px 32px 26px 32px;
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.16), inset 0 2px 4px rgba(255, 255, 255, 0.22);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .laptop-camera {
    position: absolute;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #040404;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.9), 0 0 1px rgba(255,255,255,0.25);
  }
  .laptop-camera::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #112233;
    opacity: 0.85;
  }

  .laptop-screen {
    width: 1496px;
    height: 942px;
    background: #000;
    border-radius: 6px 6px 0 0;
    overflow: hidden;
    position: relative;
  }
  .laptop-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .laptop-screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 28%, transparent 45%);
    pointer-events: none;
  }

  .laptop-base {
    position: relative;
    width: 1640px;
    height: 24px;
    background: linear-gradient(to bottom, #D5D5DA 0%, #E2E2E6 20%, #B8B8BD 75%, #8C8C91 100%);
    border-radius: 3px 3px 20px 20px;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.85), 0 2px 5px rgba(0,0,0,0.25);
    margin-top: -1px;
  }
  .laptop-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 10px;
    background: linear-gradient(to bottom, #8C8C91, #626266);
    border-radius: 0 0 8px 8px;
    box-shadow: inset 0 -1px 1px rgba(255,255,255,0.2);
  }

  /* ---------------------------------------------------- */
  /* TABLET (iPad Pro in Portrait)                        */
  /* ---------------------------------------------------- */
  .tablet-wrap {
    position: absolute;
    top: 895px;
    left: 85px;
    width: 520px;
    height: 694px;
    z-index: 5;
    background: #111113;
    border-radius: 46px;
    padding: 18px;
    box-shadow:
      25px 40px 85px rgba(0, 0, 0, 0.44),
      10px 15px 35px rgba(0, 0, 0, 0.28),
      0 4px 10px rgba(0, 0, 0, 0.2),
      inset 0 0 0 1.5px rgba(255, 255, 255, 0.16),
      inset 0 2px 4px rgba(255, 255, 255, 0.22);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .tablet-camera {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #040404;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.9), 0 0 1px rgba(255,255,255,0.2);
  }
  .tablet-screen {
    width: 484px;
    height: 658px;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    background: #000;
  }
  .tablet-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .tablet-screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(145deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 32%, transparent 50%);
    pointer-events: none;
  }

  /* ---------------------------------------------------- */
  /* SMARTPHONE (iPhone 15/16 Pro with Dynamic Island)    */
  /* ---------------------------------------------------- */
  .phone-wrap {
    position: absolute;
    top: 935px;
    left: 1650px;
    width: 310px;
    height: 674px;
    z-index: 6;
    background: #0F0F11;
    border-radius: 56px;
    padding: 12px;
    box-shadow:
      -20px 42px 90px rgba(0, 0, 0, 0.46),
      -6px 16px 36px rgba(0, 0, 0, 0.3),
      0 4px 10px rgba(0, 0, 0, 0.2),
      inset 0 0 0 1.5px rgba(255, 255, 255, 0.18),
      inset 0 2px 4px rgba(255, 255, 255, 0.24);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .phone-speaker {
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 3px;
    background: #1C1C1E;
    border-radius: 2px;
    z-index: 12;
  }
  .phone-screen {
    width: 286px;
    height: 650px;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    background: #000;
  }
  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 13px;
    left: 50%;
    transform: translateX(-50%);
    width: 86px;
    height: 25px;
    background: #000000;
    border-radius: 14px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 9px;
    box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.08);
  }
  .camera-sensor {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #182838 0%, #060A10 70%, #000 100%);
    box-shadow: 0 0 1px rgba(255,255,255,0.3);
  }
  .phone-screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(150deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.02) 30%, transparent 48%);
    pointer-events: none;
  }

</style>
</head>
<body>
  <div class="stage">
    <!-- Laptop Contact Shadow -->
    <div class="laptop-shadow"></div>

    <!-- MacBook Pro (Desktop View) -->
    <div class="laptop-wrap">
      <div class="laptop-lid">
        <div class="laptop-camera"></div>
        <div class="laptop-screen">
          <img src="mockup_screen_desktop.png" alt="Openbill Safaris Uganda Desktop View">
        </div>
      </div>
      <div class="laptop-base">
        <div class="laptop-notch"></div>
      </div>
    </div>

    <!-- iPad Pro (Tablet View) -->
    <div class="tablet-wrap">
      <div class="tablet-camera"></div>
      <div class="tablet-screen">
        <img src="mockup_screen_tablet.png" alt="Openbill Safaris Uganda Tablet View">
      </div>
    </div>

    <!-- iPhone 15/16 Pro (Mobile View) -->
    <div class="phone-wrap">
      <div class="phone-speaker"></div>
      <div class="phone-screen">
        <div class="dynamic-island">
          <div class="camera-sensor"></div>
        </div>
        <img src="mockup_screen_mobile.png" alt="Openbill Safaris Uganda Mobile View">
      </div>
    </div>
  </div>
</body>
</html>
